<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المخزون الرقمي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المخزون">
<meta name="theme-color" content="#0B1120">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%230B1120'/%3E%3Ctext x='90' y='118' font-size='92' text-anchor='middle'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%230B1120'/%3E%3Ctext x='90' y='118' font-size='92' text-anchor='middle'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D8%A7%D9%84%D9%85%D8%AE%D8%B2%D9%88%D9%86%22%2C%22short_name%22%3A%22%D8%A7%D9%84%D9%85%D8%AE%D8%B2%D9%88%D9%86%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%230B1120%22%2C%22theme_color%22%3A%22%230B1120%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1120;
    --surface:#141B2E;
    --surface-2:#1B2540;
    --border:#232C45;
    --text:#EDF0F7;
    --text-dim:#8C96AF;
    --text-faint:#5B6584;
    --blue:#3B82F6;
    --blue-soft:rgba(59,130,246,0.16);
    --green:#22C55E;
    --green-soft:rgba(34,197,94,0.16);
    --gold:#F5A623;
    --gold-soft:rgba(245,166,35,0.16);
    --red:#EF4444;
    --red-soft:rgba(239,68,68,0.16);
    --gray-soft:rgba(140,150,175,0.14);
    --radius:16px;
    --radius-sm:10px;
    --font:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;
  }
  ::selection{ background:var(--blue); color:#fff; }
  button, input, select, textarea{ font-family:var(--font); }

  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:96px;
    position:relative;
    overflow-x:hidden;
  }
  .screen{ display:none; padding:0 18px; animation:fade .18s ease; }
  .screen.active{ display:block; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }

  /* ---------- home ---------- */
  .home-header{
    padding:22px 0 18px;
  }
  .home-header .eyebrow{
    font-size:13px; color:var(--text-dim); margin:0 0 4px;
  }
  .home-header h1{
    font-size:24px; font-weight:700; margin:0; letter-spacing:-0.01em;
  }

  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    margin-bottom:12px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    display:flex; flex-direction:column; gap:22px;
  }
  .stat-card.wide{ grid-column:1 / -1; }
  .stat-icon{
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
  }
  .stat-icon.blue{ background:var(--blue-soft); }
  .stat-icon.green{ background:var(--green-soft); }
  .stat-icon.gold{ background:var(--gold-soft); }
  .stat-body .n{
    font-size:26px; font-weight:700; display:block; line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat-body .l{
    font-size:12.5px; color:var(--text-dim); margin-top:4px; display:block;
  }

  .section-title{
    font-size:14px; font-weight:600; color:var(--text-dim);
    margin:22px 0 10px;
  }
  .recent-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .recent-row:last-child{ border-bottom:none; }

  /* ---------- avatars ---------- */
  .avatar{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#fff;
  }

  /* ---------- list screen ---------- */
  .list-header{
    padding:22px 0 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .list-header h1{ font-size:22px; font-weight:700; margin:0; }

  .search{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    color:var(--text);
    font-size:14px;
    margin-bottom:12px;
  }
  .search::placeholder{ color:var(--text-faint); }
  .search:focus{ outline:2px solid var(--blue); outline-offset:0; }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:16px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; padding:8px 16px; border-radius:100px;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-dim); font-size:13px; cursor:pointer;
  }
  .chip.active{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:500; }

  .account-row{
    display:flex; align-items:center; gap:12px;
    padding:13px 0; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .account-row:active{ background:var(--surface-2); }
  .account-row .info{ flex:1; min-width:0; }
  .account-row .title{
    font-size:14.5px; font-weight:600; margin:0 0 3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .account-row .sub{
    font-size:12px; color:var(--text-faint);
    display:flex; align-items:center; gap:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .account-row .right{ text-align:left; flex-shrink:0; }
  .badge{
    display:inline-block; padding:4px 11px; border-radius:100px;
    font-size:11px; font-weight:600; margin-bottom:5px;
  }
  .badge.available{ background:var(--green-soft); color:var(--green); }
  .badge.sold{ background:var(--gold-soft); color:var(--gold); }
  .badge.reserved{ background:var(--gray-soft); color:var(--text-dim); }
  .account-row .price{
    font-size:13.5px; font-weight:600; color:var(--text);
    display:block; font-variant-numeric:tabular-nums;
  }

  .empty{ text-align:center; padding:70px 20px; color:var(--text-faint); }
  .empty .big{ font-size:32px; display:block; margin-bottom:10px; }
  .empty p{ font-size:13.5px; margin:4px 0; }

  /* ---------- form screen ---------- */
  .form-header{
    display:flex; align-items:center; gap:14px;
    padding:20px 0 18px;
    position:sticky; top:0; background:var(--bg); z-index:5;
    margin-top:calc(-1 * env(safe-area-inset-top));
    padding-top:calc(20px + env(safe-area-inset-top));
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .form-header h2{ font-size:18px; font-weight:700; margin:0; }

  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:13px; color:var(--text-dim); margin-bottom:7px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    color:var(--text);
    font-size:14.5px;
  }
  .field input:focus, .field textarea:focus{
    outline:2px solid var(--blue); outline-offset:0;
  }
  .field input::placeholder{ color:var(--text-faint); }
  .chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip-opt{
    padding:9px 16px; border-radius:100px;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-dim); font-size:13.5px; cursor:pointer;
  }
  .chip-opt.picked{ background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600; }
  .chip-opt.picked[data-status="sold"]{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
  .chip-opt.picked[data-status="reserved"]{ background:var(--gray-soft); border-color:var(--text-faint); color:var(--text); }
  .chip-opt.picked[data-status="available"]{ background:var(--green-soft); border-color:var(--green); color:var(--green); }

  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-left:44px; }
  .pw-toggle{
    position:absolute; left:6px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border:none; background:none;
    color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .form-actions{ display:flex; gap:10px; margin-top:8px; }
  .btn{
    flex:1; padding:13px; border-radius:var(--radius-sm); border:none;
    font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .btn.primary{ background:var(--blue); color:#fff; }
  .btn.danger{ background:transparent; border:1px solid var(--red); color:var(--red); flex:0 0 auto; padding:13px 18px; }
  .btn:active{ opacity:0.85; }

  /* ---------- settings ---------- */
  .settings-header{ padding:22px 0 18px; }
  .settings-header h1{ font-size:22px; font-weight:700; margin:0; }
  .settings-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 4px; border-bottom:1px solid var(--border);
  }
  .settings-item .l{ font-size:14px; }
  .settings-item .d{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .switch{
    width:44px; height:26px; border-radius:100px; background:var(--surface-2);
    border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch .knob{
    position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
    background:var(--text-faint); transition:transform .15s ease, background .15s ease;
  }
  .switch.on{ border-color:var(--blue); }
  .switch.on .knob{ transform:translateX(-18px); background:var(--blue); }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    max-width:640px; margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-around;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    background:none; border:none; color:var(--text-faint);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; padding:4px 10px; cursor:pointer;
  }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn.active{ color:var(--blue); }
  .nav-btn.add-btn .icon-wrap{
    width:40px; height:40px; border-radius:50%; background:var(--blue);
    display:flex; align-items:center; justify-content:center; color:#fff;
    margin-bottom:2px;
  }
  .nav-btn.add-btn{ color:var(--text-dim); }

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--bg);
    padding:9px 18px; border-radius:100px; font-size:12.5px; font-weight:500;
    z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, top .2s;
  }
  .toast.show{ opacity:1; top:20px; }

  @media (prefers-reduced-motion: reduce){
    .screen, .toast, .switch .knob{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="home-header">
      <p class="eyebrow">ملخص المخزون</p>
      <h1>نظرة عامة</h1>
    </div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon blue">📦</div>
        <div class="stat-body"><span class="n" id="h_total">0</span><span class="l">الإجمالي</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div class="stat-body"><span class="n" id="h_available">0</span><span class="l">متاح</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon gold">💰</div>
        <div class="stat-body"><span class="n" id="h_sold">0</span><span class="l">مباع</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">📈</div>
        <div class="stat-body"><span class="n" id="h_revenue">$0.00</span><span class="l">الإيرادات</span></div>
      </div>
      <div class="stat-card wide">
        <div class="stat-icon blue">👛</div>
        <div class="stat-body"><span class="n" id="h_value">$0.00</span><span class="l">قيمة المخزون</span></div>
      </div>
    </div>

    <p class="section-title">الأحدث</p>
    <div id="h_recent"></div>
  </div>

  <!-- LIST -->
  <div class="screen" id="screen-list">
    <div class="list-header">
      <h1>المخزون</h1>
    </div>
    <input class="search" id="searchInput" type="text" placeholder="ابحث في الحسابات">
    <div class="chips" id="catChips">
      <button class="chip active" data-cat="الكل">الكل</button>
      <button class="chip" data-cat="Streaming">Streaming</button>
      <button class="chip" data-cat="Gaming">Gaming</button>
      <button class="chip" data-cat="Social">Social</button>
      <button class="chip" data-cat="Music">Music</button>
      <button class="chip" data-cat="أخرى">أخرى</button>
    </div>
    <div id="listWrap"></div>
  </div>

  <!-- FORM -->
  <div class="screen" id="screen-form">
    <div class="form-header">
      <button class="back-btn" id="backBtn">‹</button>
      <h2 id="formTitle">حساب جديد</h2>
    </div>
    <form id="accountForm">
      <div class="field">
        <label for="f_title">العنوان</label>
        <input id="f_title" type="text" placeholder="Netflix Premium 1 Month" required>
      </div>
      <div class="field">
        <label for="f_platform">المنصة</label>
        <input id="f_platform" type="text" placeholder="Netflix / Steam / Instagram">
      </div>
      <div class="field">
        <label>الفئة</label>
        <div class="chip-group" id="catGroup">
          <button type="button" class="chip-opt picked" data-cat="Streaming">Streaming</button>
          <button type="button" class="chip-opt" data-cat="Gaming">Gaming</button>
          <button type="button" class="chip-opt" data-cat="Social">Social</button>
          <button type="button" class="chip-opt" data-cat="Music">Music</button>
          <button type="button" class="chip-opt" data-cat="أخرى">أخرى</button>
        </div>
      </div>
      <div class="field">
        <label for="f_user">اسم المستخدم / البريد</label>
        <input id="f_user" type="text" placeholder="user@example.com">
      </div>
      <div class="field">
        <label for="f_pass">كلمة المرور</label>
        <div class="pw-wrap">
          <input id="f_pass" type="password" placeholder="••••••••">
          <button type="button" class="pw-toggle" id="pwToggle">👁</button>
        </div>
      </div>
      <div class="field">
        <label for="f_price">السعر</label>
        <input id="f_price" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="field">
        <label>الحالة</label>
        <div class="chip-group" id="statusGroup">
          <button type="button" class="chip-opt picked" data-status="available">متاح</button>
          <button type="button" class="chip-opt" data-status="sold">مباع</button>
          <button type="button" class="chip-opt" data-status="reserved">محجوز</button>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteBtn" style="display:none;">حذف</button>
        <button type="submit" class="btn primary" id="saveBtn">حفظ الحساب</button>
      </div>
    </form>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div class="settings-header"><h1>الإعدادات</h1></div>
    <div class="settings-item">
      <div>
        <div class="l">المظهر الداكن</div>
        <div class="d">تفعيل أو إيقاف الوضع الليلي</div>
      </div>
      <div class="switch on" id="themeSwitch"><div class="knob"></div></div>
    </div>
    <div class="settings-item" id="clearDataBtn" style="cursor:pointer;">
      <div>
        <div class="l" style="color:var(--red);">حذف كل البيانات</div>
        <div class="d">إزالة جميع الحسابات نهائياً</div>
      </div>
      <span style="color:var(--text-faint);">‹</span>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-screen="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    الرئيسية
  </button>
  <button class="nav-btn" data-screen="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    المخزون
  </button>
  <button class="nav-btn add-btn" data-screen="form" id="addNavBtn">
    <span class="icon-wrap"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
    إضافة
  </button>
  <button class="nav-btn" data-screen="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    الإعدادات
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ================= storage layer ================= */
  var LS_KEY = "digital_inventory_accounts_v2";
  var listeners = [];
  var accounts = {};
  var useDb = false, dbApi = null;

  function notify(){
    var arr = Object.keys(accounts).map(function(id){ return Object.assign({id:id}, accounts[id]); });
    listeners.forEach(function(fn){ try{ fn(arr); }catch(e){} });
  }
  function lsLoad(){
    try{ var raw = localStorage.getItem(LS_KEY); accounts = raw ? JSON.parse(raw) : {}; }
    catch(e){ accounts = {}; }
    notify();
  }
  function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(accounts)); }catch(e){} }
  function uid(){ return 'a_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  var Store = {
    onChange: function(fn){ listeners.push(fn); },
    upsert: function(id, data){
      var isNew = !id;
      var docId = id || uid();
      if(useDb && dbApi){
        var ref = dbApi.collection('accounts').doc(docId);
        var existingCreated = (accounts[docId] && accounts[docId].createdAt) || Date.now();
        var payload = Object.assign({}, data, { updatedAt: Date.now(), createdAt: existingCreated });
        ref.set(payload).catch(function(){});
      } else {
        var existing = accounts[docId] || {};
        accounts[docId] = Object.assign({}, existing, data, {
          updatedAt: Date.now(), createdAt: existing.createdAt || Date.now()
        });
        lsSave(); notify();
      }
      return docId;
    },
    remove: function(id){
      if(useDb && dbApi){ dbApi.collection('accounts').doc(id).delete().catch(function(){}); }
      else { delete accounts[id]; lsSave(); notify(); }
    },
    clearAll: function(){
      if(useDb && dbApi){
        Object.keys(accounts).forEach(function(id){ dbApi.collection('accounts').doc(id).delete().catch(function(){}); });
      } else { accounts = {}; lsSave(); notify(); }
    },
    init: function(){
      if(window.claude && window.claude.use){
        window.claude.use('db').then(function(db){
          if(!db){ lsLoad(); return; }
          useDb = true; dbApi = db;
          db.collection('accounts').onSnapshot(function(snap){
            var map = {};
            snap.docs.forEach(function(d){ map[d.id] = d.data(); });
            accounts = map; notify();
          }, function(){ lsLoad(); });
        }).catch(function(){ lsLoad(); });
      } else { lsLoad(); }
    }
  };

  /* ================= helpers ================= */
  function money(n){ n = Number(n)||0; return '$' + n.toFixed(2); }
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function statusLabel(s){
    return s === 'sold' ? 'مباع' : (s === 'reserved' ? 'محجوز' : 'متاح');
  }
  var AVATAR_COLORS = {
    'Streaming':'#3B82F6','Gaming':'#8B5CF6','Social':'#EC4899','Music':'#14B8A6','أخرى':'#64748B','':'#64748B'
  };
  function avatarColor(cat){ return AVATAR_COLORS[cat] || '#64748B'; }
  function avatarLetter(a){
    var src = a.platform || a.title || '?';
    return src.trim().charAt(0).toUpperCase() || '?';
  }
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 1500);
  }

  /* ================= navigation ================= */
  var screens = ['home','list','form','settings'];
  var currentScreen = 'home';
  var prevScreen = 'list';

  function showScreen(name, opts){
    opts = opts || {};
    if(currentScreen === 'form' && name !== 'form'){ /* leaving form */ }
    if(name !== 'form') prevScreen = name;
    currentScreen = name;
    screens.forEach(function(s){
      document.getElementById('screen-'+s).classList.toggle('active', s === name);
    });
    document.querySelectorAll('.nav-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-screen') === name && name !== 'form');
    });
    window.scrollTo(0,0);
  }

  document.querySelectorAll('.nav-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var target = btn.getAttribute('data-screen');
      if(target === 'form'){
        resetForm();
        showScreen('form');
      } else {
        showScreen(target);
      }
    });
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    showScreen(prevScreen === 'form' ? 'list' : prevScreen);
  });

  /* ================= rendering ================= */
  var allAccounts = [];

  function computeStats(arr){
    var total = arr.length, available = 0, sold = 0, revenue = 0, invValue = 0;
    arr.forEach(function(a){
      if(a.status === 'available'){ available++; invValue += Number(a.price||0); }
      else if(a.status === 'sold'){ sold++; revenue += Number(a.price||0); }
    });
    return { total:total, available:available, sold:sold, revenue:revenue, invValue:invValue };
  }

  function rowHtml(a){
    var color = avatarColor(a.category);
    var letter = avatarLetter(a);
    var dots = '••••••';
    return '<div class="account-row" data-id="'+a.id+'">' +
      '<div class="avatar" style="background:'+color+'">'+escapeHtml(letter)+'</div>' +
      '<div class="info">' +
        '<p class="title">'+escapeHtml(a.title||'بدون عنوان')+'</p>' +
        '<div class="sub">'+dots+' · '+escapeHtml(a.platform||a.category||'')+'</div>' +
      '</div>' +
      '<div class="right">' +
        '<span class="badge '+(a.status||'available')+'">'+statusLabel(a.status)+'</span>' +
        '<span class="price">'+money(a.price)+'</span>' +
      '</div>' +
    '</div>';
  }

  function renderHome(arr){
    var s = computeStats(arr);
    document.getElementById('h_total').textContent = s.total;
    document.getElementById('h_available').textContent = s.available;
    document.getElementById('h_sold').textContent = s.sold;
    document.getElementById('h_revenue').textContent = money(s.revenue);
    document.getElementById('h_value').textContent = money(s.invValue);

    var recent = arr.slice().sort(function(x,y){ return (y.createdAt||0)-(x.createdAt||0); }).slice(0,4);
    var recentEl = document.getElementById('h_recent');
    if(recent.length === 0){
      recentEl.innerHTML = '<div class="empty"><span class="big">🗂️</span><p>لا توجد حسابات بعد.</p><p>اضغط "إضافة" لإضافة أول حساب.</p></div>';
    } else {
      recentEl.innerHTML = recent.map(rowHtml).join('');
    }
  }

  var currentFilter = 'الكل';
  var searchTerm = '';

  function renderList(arr){
    var cats = {};
    arr.forEach(function(a){ if(a.category) cats[a.category] = true; });

    var filtered = arr.filter(function(a){
      if(currentFilter !== 'الكل' && a.category !== currentFilter) return false;
      if(searchTerm){
        var t = searchTerm.toLowerCase();
        var hay = ((a.title||'')+' '+(a.platform||'')+' '+(a.user||'')).toLowerCase();
        if(hay.indexOf(t) === -1) return false;
      }
      return true;
    });
    filtered.sort(function(x,y){ return (y.createdAt||0)-(x.createdAt||0); });

    var wrap = document.getElementById('listWrap');
    if(filtered.length === 0){
      wrap.innerHTML = '<div class="empty"><span class="big">🗂️</span>' +
        '<p>لا توجد حسابات مطابقة.</p>' +
        (arr.length===0 ? '<p>اضغط "إضافة" لإضافة أول حساب.</p>' : '') +
        '</div>';
      return;
    }
    wrap.innerHTML = filtered.map(rowHtml).join('');
  }

  function renderAll(arr){
    allAccounts = arr;
    renderHome(arr);
    renderList(arr);
  }

  Store.onChange(renderAll);
  Store.init();

  document.getElementById('h_recent').addEventListener('click', handleRowClick);
  document.getElementById('listWrap').addEventListener('click', handleRowClick);

  function handleRowClick(e){
    var row = e.target.closest('.account-row');
    if(!row) return;
    var id = row.getAttribute('data-id');
    openEdit(id);
  }

  /* ---- category chips (list filter) ---- */
  document.getElementById('catChips').addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('#catChips .chip').forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-cat');
    renderList(allAccounts);
  });
  document.getElementById('searchInput').addEventListener('input', function(e){
    searchTerm = e.target.value.trim();
    renderList(allAccounts);
  });

  /* ================= form ================= */
  var editingId = null;
  var form = document.getElementById('accountForm');

  function setCatPicked(cat){
    document.querySelectorAll('#catGroup .chip-opt').forEach(function(b){
      b.classList.toggle('picked', b.getAttribute('data-cat') === cat);
    });
  }
  function setStatusPicked(status){
    document.querySelectorAll('#statusGroup .chip-opt').forEach(function(b){
      b.classList.toggle('picked', b.getAttribute('data-status') === status);
    });
  }
  document.getElementById('catGroup').addEventListener('click', function(e){
    var b = e.target.closest('.chip-opt'); if(!b) return;
    setCatPicked(b.getAttribute('data-cat'));
  });
  document.getElementById('statusGroup').addEventListener('click', function(e){
    var b = e.target.closest('.chip-opt'); if(!b) return;
    setStatusPicked(b.getAttribute('data-status'));
  });

  document.getElementById('pwToggle').addEventListener('click', function(){
    var inp = document.getElementById('f_pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  function resetForm(){
    editingId = null;
    form.reset();
    setCatPicked('Streaming');
    setStatusPicked('available');
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('formTitle').textContent = 'حساب جديد';
    document.getElementById('saveBtn').textContent = 'حفظ الحساب';
    document.getElementById('f_pass').type = 'password';
  }

  function openEdit(id){
    var a = accounts[id];
    if(!a) return;
    editingId = id;
    document.getElementById('f_title').value = a.title || '';
    document.getElementById('f_platform').value = a.platform || '';
    document.getElementById('f_user').value = a.user || '';
    document.getElementById('f_pass').value = a.password || '';
    document.getElementById('f_price').value = a.price != null ? a.price : '';
    setCatPicked(a.category || 'Streaming');
    setStatusPicked(a.status || 'available');
    document.getElementById('deleteBtn').style.display = 'inline-block';
    document.getElementById('formTitle').textContent = 'تعديل الحساب';
    document.getElementById('saveBtn').textContent = 'حفظ التعديلات';
    showScreen('form');
  }

  document.getElementById('deleteBtn').addEventListener('click', function(){
    if(!editingId) return;
    if(confirm('هل تريد حذف هذا الحساب نهائياً؟')){
      Store.remove(editingId);
      toast('تم الحذف');
      showScreen(prevScreen === 'form' ? 'list' : prevScreen);
    }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pickedCat = document.querySelector('#catGroup .chip-opt.picked');
    var pickedStatus = document.querySelector('#statusGroup .chip-opt.picked');
    var data = {
      title: document.getElementById('f_title').value.trim(),
      platform: document.getElementById('f_platform').value.trim(),
      category: pickedCat ? pickedCat.getAttribute('data-cat') : 'Streaming',
      user: document.getElementById('f_user').value.trim(),
      password: document.getElementById('f_pass').value,
      price: parseFloat(document.getElementById('f_price').value) || 0,
      status: pickedStatus ? pickedStatus.getAttribute('data-status') : 'available'
    };
    if(!data.title){ return; }
    Store.upsert(editingId, data);
    toast(editingId ? 'تم حفظ التعديلات' : 'تمت الإضافة');
    showScreen(prevScreen === 'form' ? 'list' : prevScreen);
  });

  /* ================= settings ================= */
  var themeSwitch = document.getElementById('themeSwitch');
  function applyTheme(dark){
    themeSwitch.classList.toggle('on', dark);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  }
  try{
    var saved = localStorage.getItem('inv_dark');
    applyTheme(saved === null ? true : saved === '1');
  }catch(e){ applyTheme(true); }
  themeSwitch.addEventListener('click', function(){
    var isOn = !themeSwitch.classList.contains('on');
    applyTheme(isOn);
    try{ localStorage.setItem('inv_dark', isOn ? '1' : '0'); }catch(e){}
  });

  document.getElementById('clearDataBtn').addEventListener('click', function(){
    if(confirm('سيتم حذف جميع الحسابات المخزّنة نهائياً. متابعة؟')){
      Store.clearAll();
      toast('تم حذف كل البيانات');
    }
  });

})();
</script>
</body>
</html>
